# Disable Dynamic Light Shadow (perf increase): Kyo's 1.09 patch from his
# shadPS4 list (Bloodborne.xml), byte for byte. Off until turned on (the setup
# window's Patches tab, or disable-dynamic-light-shadow = true under [patches]
# in bbhost.toml).
#
# The scene context's constructor sets seven flags (engine/graphics_patch.cpp,
# kFlags); the one at +0x296e (`mov byte [rbx+0x296e], 1` at 0x26c2532, its
# immediate at 0x26c2538) is the dynamic lights' shadows. It starts as 0.
[patch]
name = "disable-dynamic-light-shadow"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "動的光源の影を無効化して負荷を軽減 (Kyo)"
enabled = false
order = 128

# mov byte [rbx+0x296e], 1 -> 0
[site.flag]
address = "0x026c2538"
expect = "01"
bytes = "00"
