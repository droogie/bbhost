# Kyo's Bloodborne 1.09 "bb 00900" patch: The Old Hunters without the add-on.
#
# The locale setup (Binary Ninja sub_23b6cf0, CSLocalize) stores the package
# edition at 0x552894c from sub_23b8ee0: the system property
# Localize.Pkgedition, which defaults to the tens digit of the app's
# USER_DEFINED_PARAM_1. The dump's base package says 0. The call becoming
# `mov eax, 1` makes the game the Old Hunters edition (CUSA03179 in the US),
# whose package carries the DLC. CSDlc counts The Old Hunters as available
# when add-on 3 is owned or the edition is 1 (sub_23b5620), and sets event
# flag 6899 from that on every update; the DLC's events read the flag.
#
# The same index picks the edition's title ID and HTTP User-Agent ("...
# A-UP9000-CUSA03179_00-BLOODBORNE000000..."). The private server accepts
# both editions' agents (config.py SS_INFO_USER_AGENTS) and matches them
# together. bbhost's saves go by directory name, not title ID, so the
# character list is the same either way.
#
# A patch like any other, on unless turned off: the setup window's Patches
# tab, or `old-hunters = false` under [patches] in bbhost.toml; it applies at
# the next start. bbhost leaves it off, saying why in the log, when the game
# files lack the DLC's own (its title art, MENU_Title_00004, and its three
# areas): files older than the 1.09 update's, whose title would be a flat
# green picture (engine/patch_manifest.cpp, old_hunters_missing). (In v0.2.9 it was a PC enhancement, `old_hunters` under
# [world]; a file that turned it off there still does.)
[patch]
name = "old-hunters"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "DLC 同梱版として認識し、The Old Hunters を利用可能にする"

[site.pkgedition]
address = "0x023b6d20"
expect = "e8 bb 21 00 00"
bytes = "b8 01 00 00 00"
