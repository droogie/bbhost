# Restore Debug Dash: stagvant's patch for 1.09, from the community patch list
# (Bloodborne-Orbis.xml and Kyo's shadPS4 lists, PatchVer 1.0), byte for byte.
#
# L3 (Left Ctrl) turns it on and off. On, the hunter moves at debug speed;
# hold L2 (X) to rise, L1 (C) to sink, and R2 (V) to pass through walls.
#
# The hook (0x1cbd711, in the character's per-frame movement step) jumps into
# new code that, for the player's character only, reads the four buttons
# through the game's pad lookup (0x1391c60), toggles its on/off byte, sets the
# character's flag 0x40 at +0x1e1, moves it up or down, sets or clears the
# no-collision bit, scales the move speed, runs the displaced instruction and
# returns. The new code is written over 352 bytes of read-only error strings
# of the engine's stream classes (the source paths of DLFileInputStream.cpp,
# DLMemoryInputStream.cpp, DLStreamBuffer.cpp and messages such as "fail.
# 'size' over 2GB."), which the game reads only to report those errors: while
# this is on, such a report shows garbage instead of the file name.
#
# The altitude change is a fixed step each frame, so at 60 fps it climbs twice
# as fast as at 30. The debug camera (debug-camera.toml) answers L3 too:
# with both on, its Interact+L3 also turns the dash on or off.
#
# The page its code is on also holds the debug menu's font paths (written
# while that plugin is on) and the cloth's stiffness scale (frame rates above
# 60): those writes once left the page unexecutable, and the game faulted
# the first time the hook ran - they keep it executable now (core/memory.h).
#
# Off until turned on: the setup window's Patches tab, or `debug-dash = true`
# under [patches] in bbhost.toml, for the next start. The log then says
# "patch: debug-dash: 7 of 7 sites written".
[patch]
name = "debug-dash"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "開発用ダッシュを復元 (stagvant)"
enabled = false
gameplay = true
order = 109

[site.s000]
address = "0x01cbd711"
expect = "c5 fa 11 45 84"
bytes = "e9 ce e1 07 03"

