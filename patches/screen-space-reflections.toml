# Enable Screen Space Reflections (enable only, keeps res): Kyo's 1.09 patch
# from his shadPS4 list (Bloodborne.xml), byte for byte. Off until turned on
# (the setup window's Patches tab, or screen-space-reflections = true under
# [patches] in bbhost.toml).
#
# It turns the scene context's reflection pass on and gives it a depth it can
# read: the half-size depth render back at half size (four sites that write
# the game's own code, undoing a resolution patch's fixed size - so
# low-res-aux-targets steps aside for them) as 32-bit float depth (0x125b1bf:
# format 0x14 -> 0x28), and its own targets sized and fed. Its two sites
# that rewrite calls already as shipped (0x26a10c0, 0x26a2829) and two that
# rewrite a byte as shipped (0x26c3d7d, 0x26c4fd7) are kept as the list has
# them: they undo other patches of that list. The HD Motion Blur patches set
# the depth renders after this one in the list, so these four step aside for
# them (yields).
[patch]
name = "screen-space-reflections"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "画面空間反射を有効化（解像度は維持）(Kyo)"
enabled = false
order = 114

[site.enable-a]
address = "0x026c4fd7"
expect = "01"
bytes = "01"

# ja -> je
[site.enable-b]
address = "0x026c4fd3"
expect = "77"
bytes = "74"

# je 0x26c3d84 -> nop nop
[site.enable-c]
address = "0x026c3d2f"
expect = "74 53"
bytes = "90 90"

[site.enable-d]
address = "0x026c3d7d"
expect = "01"
bytes = "01"

# -0.8f -> -10000.0f
[site.constant-a]
address = "0x02695a5b"
expect = "cd cc 4c bf"
bytes = "00 40 1c c6"

# vmovss xmm0 from another constant
[site.constant-load]
address = "0x026b8d65"
expect = "c5 fa 10 05 1f 0f 67 02"
bytes = "c5 fa 10 05 c7 7c 5c 02"

# 1.0f -> 0.0f
[site.constant-b]
address = "0x012a8cfd"
expect = "00 00 80 3f"
bytes = "00 00 00 00"

# the game's own: width / 2
[site.depth-half-width]
address = "0x0125b1a3"
expect = "8b 03 d1 e8 89 04 24"
bytes = "8b 03 d1 e8 89 04 24"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]

# height / 2
[site.depth-half-height]
address = "0x0125b1aa"
expect = "8b 43 04 d1 e8 89 44 24 04"
bytes = "8b 43 04 d1 e8 89 44 24 04"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]

# width / 4
[site.depth-quarter-width]
address = "0x0125b1d6"
expect = "8b 03 c1 e8 02 89 04 24"
bytes = "8b 03 c1 e8 02 89 04 24"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]

# height / 4
[site.depth-quarter-height]
address = "0x0125b1de"
expect = "8b 43 04 c1 e8 02 89 44 24 04"
bytes = "8b 43 04 c1 e8 02 89 44 24 04"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]

# the depth render's format 0x14 -> 0x28 (D32_FLOAT)
[site.depth-format]
address = "0x0125b1bf"
expect = "14"
bytes = "28"

# call 0x268f180, as shipped
[site.call-a]
address = "0x026a10c0"
expect = "e8 bb e0 fe ff"
bytes = "e8 bb e0 fe ff"

# call 0x268f180, as shipped
[site.call-b]
address = "0x026a2829"
expect = "e8 52 c9 fe ff"
bytes = "e8 52 c9 fe ff"

# mov ecx, r12d -> push 10; pop rcx
[site.size-a]
address = "0x026c429a"
expect = "44 89 e1"
bytes = "6a 0a 59"

# mov dword [rsp], 0; xor ecx, ecx; mov r9d, 20; mov r8d, r12d -> ... mov r8d, 10
[site.size-b]
address = "0x026c42b4"
expect = "c7 04 24 00 00 00 00 31 c9 41 b9 14 00 00 00 45 89 e0"
bytes = "83 24 24 00 31 c9 41 b9 14 00 00 00 41 b8 0a 00 00 00"
