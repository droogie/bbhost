# Unlock Game Region: Lance McDonald (manfightdragon), Kyo's patch for 1.09,
# from the shadPS4 patch list (Bloodborne.xml), byte for byte: 3 sites, 36
# bytes.
#
# The list's note:
# Unlocks the game region to support additional language options, Doesn't
# switch the X and Circle buttons
#
# The region is read at the start: on or off applies at the next start.
#
# Off until turned on: the setup window's Patches tab, the patch menu in the
# game (F9), or `unlock-game-region = true` under [patches] in bbhost.toml.
[patch]
name = "unlock-game-region"
title = "Unlock Game Region (DISABLES ONLINE PLAY)"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "Unlocks the game's region for more language options. Online play does not work while it is on. The Cross and Circle buttons are not swapped."
enabled = false
order = 460
live = false

[site.s000]
address = "0x023b9190"
expect = "55 48 89 e5 41 57"
bytes = "b8 05 00 00 00 c3"

