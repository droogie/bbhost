# Performance Patch v3 (Decals On): Kyo's patch for 1.09, from Kyo's shadPS4 list
# (user/patches/shadPS4/Bloodborne.xml), byte for byte: 191 lines, 1319 bytes.
#
# Imported whole at Kyo's request (2026-10-08), to be judged in play. A
# 2026-10-03 review of it, entry by entry in Binary Ninja, found
# parts emulator-specific, parts that natively leave SSAO, depth of field and
# distortion reading stale buffers (the skipped depth and scene copies), and
# parts it judged harmful (the file cache's access-time skips, a condition
# wait made a `ret`, a cave calling with a misaligned stack, the assert and
# DL_PANIC suppression). The light grid's 1x1 job split is bbhost's own
# already (graphics_patch.cpp keeps its window-sized tiles); the mesh LOD
# edit at 0x216fc09 overrides PC Graphics' Model detail while it is on.
# One variant on at a time (group performance-v3): they share 1,295 bytes.
#
# Off until turned on: the setup window's Patches tab, or `performance-v3-decals-on = true` under
# [patches] in bbhost.toml, turns it on for the next start.
