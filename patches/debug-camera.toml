# Restore Debug Camera: Lance McDonald's (manfightdragon) patch for 1.09, from
# the community patch list (Bloodborne-Orbis.xml, PatchVer 1.0), byte for byte.
#
# Hold Action (Cross; E on the keyboard) and press L3 (Left Ctrl) to cycle
# through the free camera's modes: the left stick flies it, the right stick
# turns it, and the hunter stays put.
#
# The debug camera's step (sub_1972900; addresses are Binary Ninja's) looks the
# pad up through FD4PadManager. The hook sends both outcomes of that lookup into
# new code, which reads the two buttons, switches the camera's mode flags and
# copies its matrices, then runs the instruction it displaced and returns. The
# new code takes the place of a debug-only load-test step's constructor and
# deleting destructor (sub_1de3330, 0x1de3670), which only the debug menu's
# "LOAD TEST" and "DUNGEON MOVEMAP TEST" entries create: while this is on,
# those two entries crash the game.
#
# Off by default: the Game tab's Debug camera in the setup window, F10 >
# STARTUP > Debug camera, or the setup window's Patches tab turn it on for the
# next start. The log then says "patch: debug-camera: 15 of 15 sites written".
[patch]
name = "debug-camera"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "自由カメラを復元。調べるを押しながら L3 で切替 (Lance McDonald)"
option = "debug.free_camera"

[site.step-hook]
address = "0x01972998"
expect = "74 17 48 39 4a 20 48 89 c1 7f 03 48 89 d1 48 39 c1 74 06 c6 41 30 01 eb 05 e8 fa 3a d9 ff 41 83 bc 24 c4 00 00 00 01"
