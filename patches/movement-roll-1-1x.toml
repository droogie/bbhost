# Movement + Roll-Dodge 1.1x (normal size): Kyo's patch for 1.09, from Kyo's shadPS4 list
# (user/patches/shadPS4/Bloodborne.xml), byte for byte: 25 lines, 219 bytes.
#
# Twenty of its words are the follow camera constructor's defaults
# (0x183a4c3..0x183a939), which the frame-rate conversion writes too: with
# this on they are left as it writes them (Kyo's 60 fps values x1.1) and the
# rest of the conversion goes on (engine/frame_rate.cpp). Its code goes over
# assert strings in the read-only data (0x4d3be00), next to debug-dash's and
# bigger-weapons-1-2x's.
#
# Off until turned on: the setup window's Patches tab, or `movement-roll-1-1x = true` under
# [patches] in bbhost.toml, turns it on for the next start.
