# rgba8f color space (Perf Increase): Kyo's patch for 1.09, from the shadPS4
# patch list (Bloodborne.xml), byte for byte: 7 sites, 12 bytes.
#
# The list's note:
# AFFECTS VISUALS: changes rgba16f color space to rgba8f. GPU use reduction,
# will help older/weak hardware.
#
# The targets' formats are chosen as they are made: on or off applies at the
# next start.
#
# Off until turned on: the setup window's Patches tab, the patch menu in the
# game (F9), or `rgba8f-color-space = true` under [patches] in bbhost.toml.
[patch]
name = "rgba8f-color-space"
title = "rgba8f color space (Perf Increase)"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "Affects visuals: the rgba16f colour targets become rgba8f. Less GPU use, for older or weaker hardware."
enabled = false
order = 30
live = false

[site.s000]
address = "0x026c1084"
expect = "00"
bytes = "01"

[site.s001]
