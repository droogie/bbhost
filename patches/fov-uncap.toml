# The camera's field of view is clamped to 38-48 degrees where the option
# table's value is applied (Binary Ninja 0x183af4e, `cmovbe rax, rsi`). Taking
# the clamp out lets the PC Camera section (F10) set any field of view; the
# engine/camera.cpp scaler applies the chosen value each frame.
[patch]
name = "fov-uncap"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "視野角48度の上限を解除"

[site.clamp]
address = "0x183af4e"
expect = "48 0f 46 c6"
bytes = "48 89 f0 90"
