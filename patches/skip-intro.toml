# illusion's Bloodborne 1.09 "Skip Intro" patch. The three company logos
# (FromSoftware, Japan Studio, SCE) are entries the startup flow plays by
# name; emptying the first two UTF-16 characters of each name makes the flow
# skip them. The warning "At the end of the previous session, Exit Game
# (system menu) may not have been selected" - shown after any session that
# ended another way, which on PC is closing the window - is a step the startup
# flow builds only when its state is 6 (Binary Ninja sub_202edf0: a dialog of
# message 400003, group 204). The jne there becoming a jmp builds the step
# that follows it instead, as every other state does (the community list's
# 0x0202EE1C EB73).
# Enabled by `skip_intro = true` under [startup] in bbhost.toml
# (BBHOST_SKIP_INTRO=1 overrides). Story movies are untouched.
[patch]
name = "skip-intro"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "起動時の３つの企業ロゴと終了警告を省略"
option = "startup.skip_intro"

[site.logo-fromsoft]
address = "0x04d99138"
expect = "4c 00 6f 00"
bytes = "00 00 00 00"

[site.logo-jstudio]
address = "0x04d99154"
expect = "4c 00 6f 00"
bytes = "00 00 00 00"

[site.logo-sce]
address = "0x04d9916e"
expect = "4c 00 6f 00"
bytes = "00 00 00 00"

[site.startup-warning]
address = "0x0202ee1c"
expect = "75 73"
bytes = "eb 73"
