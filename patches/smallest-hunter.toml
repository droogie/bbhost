# Smallest Hunter: Kyo's patch for 1.09, from the shadPS4 patch list
# (Bloodborne.xml), byte for byte: 65 sites, 585 bytes.
#
# The list's note:
# teeny
#
# Seven of its sites are the list's Increased camera distance's, which bbhost
# leaves out (PC Camera's Camera distance does it): this writes its own
# camera values there. They are ones bbhost's frame-rate conversion writes
# above 30 fps: there it is left to them at the start, and on or off
# applies at the next start. One hunter size at a time.
#
# Off until turned on: the setup window's Patches tab, the patch menu in the
# game (F9), or `smallest-hunter = true` under [patches] in bbhost.toml.
