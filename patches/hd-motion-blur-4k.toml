# HD Motion Blur 4K (3840x2160): Kyo's 1.09 patch from his shadPS4 list
# (Bloodborne.xml), byte for byte. Off until turned on (the setup window's
# Patches tab, or hd-motion-blur-4k = true under [patches] in bbhost.toml).
#
# Motion blur's buffers at a fixed size: the scene context's half-size target
# and the half-size depth render at 3840x2160, the quarter-size one at
# 1920x1080, and the scene context's flag at +0x2a10 set
# (`mov byte [rbx+0x2a10], 0` at 0x26c2657, its immediate at 0x26c265d). The
# same words as low-res-aux-targets and Enable Screen Space Reflections, which
# step aside for this one, as it comes after them in the list.
[patch]
name = "hd-motion-blur-4k"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "高解像度モーションブラー 4K (3840x2160) (Kyo)"
enabled = false
order = 186
group = "hd-motion-blur"

# mov eax, 3840
[site.scene-half-width]
address = "0x026c3de4"
expect = "41 8b 07 d1 e8"
bytes = "b8 00 0f 00 00"

# mov eax, 2160
[site.scene-half-height]
address = "0x026c3df0"
expect = "41 8b 47 04 d1 e8"
bytes = "b8 70 08 00 00 90"

# mov dword [rsp], 3840
[site.depth-half-width]
address = "0x0125b1a3"
expect = "8b 03 d1 e8 89 04 24"
bytes = "c7 04 24 00 0f 00 00"

# mov dword [rsp+4], 2160
[site.depth-half-height]
address = "0x0125b1aa"
expect = "8b 43 04 d1 e8 89 44 24 04"
bytes = "c7 44 24 04 70 08 00 00 90"

# mov dword [rsp], 1920
[site.depth-quarter-width]
address = "0x0125b1d6"
expect = "8b 03 c1 e8 02 89 04 24"
bytes = "c7 04 24 80 07 00 00 90"

# mov dword [rsp+4], 1080
[site.depth-quarter-height]
address = "0x0125b1de"
expect = "8b 43 04 c1 e8 02 89 44 24 04"
bytes = "c7 44 24 04 38 04 00 00 90 90"

# mov byte [rbx+0x2a10], 0 -> 1
[site.hd-flag]
address = "0x026c265d"
expect = "00"
bytes = "01"
