# The low-resolution renders of Kyo's shadPS4 resolution patches, at every
# resolution: every "Resolution Patch WxH" in his list makes motion blur's
# buffers a fixed size whatever the render size is, for their cost - they are
# drawn every frame and scale with the pixel count.
#
#   0x125b1a3..de  the depth renders at a half and a quarter of the render
#                  size (a colour and depth pair each, formats 0x1c / 0x14):
#                  the half one is the depth the velocity pass tests against
#                  -> 640x360 and 320x180
#   0x26c3de4/f0   the scene context's two half-size targets: the velocity
#                  map and its ping-pong partner (+0xce0, +0xd38) -> 640x360
#
# bbhost's resolution changes the two words every pass reads (0x55289f8,
# engine/graphics_patch.cpp), so without this they followed it: at 4K the
# velocity map alone was 1920x1080 against the patches' 640x360. The
# velocities it holds are the same at either size (measured mid-swing: the
# same spread of values at 640x360 as at 960x540), so the blur's length does
# not change with it. They are the patches' own bytes. A site steps aside
# while a patch that sets the same words differently is on (yields), as that
# patch's lines come after the resolution patches' in the list: Enable Screen
# Space Reflections keeps the depth renders at half and quarter size, the HD
# Motion Blur ones set their own sizes.
#
# The patches also make the glow buffer (the scene context's +0x398, the
# lighting composite's second target) 80x45 - not taken: the composite draws
# the whole screen into it and its first target at once, and a pass is as
# large as its smallest target, so where an area turns glow on (or Glow:
# force on does) the world was drawn into its top-left 80x45 and the rest
# left black (NVIDIA players' screenshots, 2026-10-14).
#
# Off until turned on: the game's own sizes are half and a quarter of the
# render size, so at 1920x1080 this takes the velocity map from 960x540 down
# to 640x360, below what the game shipped with.
[patch]
name = "low-res-aux-targets"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "モーションブラー用バッファーを 640x360、縮小深度を 320x180 に固定"
enabled = false
order = 53

# sub_125b0xx: mov eax, [rbx]; shr eax, 1; mov [rsp], eax -> mov dword [rsp], 640
[site.depth-half-width]
address = "0x0125b1a3"
expect = "8b 03 d1 e8 89 04 24"
bytes = "c7 04 24 80 02 00 00"
yields = ["screen-space-reflections", "hd-motion-blur-360p", "hd-motion-blur-4k"]

# mov eax, [rbx+4]; shr eax, 1; mov [rsp+4], eax -> mov dword [rsp+4], 360
[site.depth-half-height]
address = "0x0125b1aa"
expect = "8b 43 04 d1 e8 89 44 24 04"
bytes = "c7 44 24 04 68 01 00 00 90"
yields = ["screen-space-reflections", "hd-motion-blur-360p", "hd-motion-blur-4k"]

# mov eax, [rbx]; shr eax, 2; mov [rsp], eax -> mov dword [rsp], 320
[site.depth-quarter-width]
address = "0x0125b1d6"
expect = "8b 03 c1 e8 02 89 04 24"
bytes = "c7 04 24 40 01 00 00 90"
yields = ["screen-space-reflections", "hd-motion-blur-360p", "hd-motion-blur-4k"]

# mov eax, [rbx+4]; shr eax, 2; mov [rsp+4], eax -> mov dword [rsp+4], 180
[site.depth-quarter-height]
address = "0x0125b1de"
expect = "8b 43 04 c1 e8 02 89 44 24 04"
bytes = "c7 44 24 04 b4 00 00 00 90 90"
yields = ["screen-space-reflections", "hd-motion-blur-360p", "hd-motion-blur-4k"]

# the scene context's velocity map pair: mov eax, [r15]; shr eax, 1 -> mov eax, 640
[site.scene-half-width]
address = "0x026c3de4"
expect = "41 8b 07 d1 e8"
bytes = "b8 80 02 00 00"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]

# mov eax, [r15+4]; shr eax, 1 -> mov eax, 360
[site.scene-half-height]
address = "0x026c3df0"
expect = "41 8b 47 04 d1 e8"
bytes = "b8 68 01 00 00 90"
yields = ["hd-motion-blur-360p", "hd-motion-blur-4k"]
