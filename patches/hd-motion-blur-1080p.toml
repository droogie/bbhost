# HD Motion Blur 1080p (1920x1080): Kyo's patch for 1.09, from the shadPS4
# patch list (Bloodborne.xml), byte for byte: 7 of its 9 lines, 46 bytes.
#
# The list's note:
# Motion blur velomap is default set to /2 of your render resolution, this
# forces it to 1080p. set dmem 4000+ as this uses more vram.
#
# Its sizes are taken as the targets are made: on or off applies at the next
# start. One HD Motion Blur at a time.
#
# The list's version also sets Increased Graphics Heap Sizes' two words
# (0x4b36dda, 0x4b36de2): left out, as bbhost grows that heap itself for
# the render size (engine/live_resolution.cpp, grow_gfx_heap), and refuses
# to when another size is there - which held live resolution changes to
# 1080p.
#
# Off until turned on: the setup window's Patches tab, the patch menu in the
# game (F9), or `hd-motion-blur-1080p = true` under [patches] in bbhost.toml.
[patch]
name = "hd-motion-blur-1080p"
title = "HD Motion Blur 1080p (1920x1080)"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "Motion blur's velocity map is half the render resolution by default; this makes it 1080p. Uses more video memory."
enabled = false
order = 820
group = "hd-motion-blur"
live = false

[site.s002]
address = "0x026c3de4"
expect = "41 8b 07 d1 e8"
bytes = "b8 80 07 00 00"

[site.s003]
address = "0x026c3df0"
expect = "41 8b 47 04 d1 e8"
bytes = "b8 38 04 00 00 90"

[site.s004]
address = "0x0125b1a3"
expect = "8b 03 d1 e8 89 04 24"
bytes = "c7 04 24 80 07 00 00"

[site.s005]
address = "0x0125b1aa"
expect = "8b 43 04 d1 e8 89 44 24 04"
bytes = "c7 44 24 04 38 04 00 00 90"

[site.s006]
address = "0x0125b1d6"
expect = "8b 03 c1 e8 02 89 04 24"
bytes = "c7 04 24 c0 03 00 00 90"

[site.s007]
address = "0x0125b1de"
expect = "8b 43 04 c1 e8 02 89 44 24 04"
bytes = "c7 44 24 04 1c 02 00 00 90 90"

[site.s008]
address = "0x026c265d"
expect = "00"
bytes = "01"
